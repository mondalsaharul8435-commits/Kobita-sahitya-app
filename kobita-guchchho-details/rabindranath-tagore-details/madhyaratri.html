    <main class="poem-content">
        <h2 style="text-align: center; margin-bottom: 20px;">৬. মধ্যরাত্রি</h2>
        
        <div style="poem-text">
            <p style="text-align: center; line-height: 1.8;">
                দ্যাখো সখি আঁধারের পানে চেয়ে আছে দুটি শুভ্র তারা।<br>
                দুটি শিখা বিকম্পিত প্রাণে চেয়ে আছে স্থিররাত্রি পানে,<br>
                আঁধারের রহস্যের টানে দুটি আলো হ'য়ে আত্মহারা।<br>
                রাখো সখি জ্বেলে মোর প্রাণে আলো ভরা দুটি কালো তারা।
            </p>
        </div>
    </main>
