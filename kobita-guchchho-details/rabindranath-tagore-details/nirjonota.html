    </header>

    <main class="poem-content">
        <h2 style="text-align: center; margin-bottom: 20px;">৯. নির্জনতা</h2>
        
        <div style="poem-text">
            <p style="text-align: center; line-height: 1.8;">
                মাঝে আমি খুঁজি আমার আপন সুর,<br>
                নিঃশব্দের এই সমুদ্রে বাজে অদৃশ্য বাঁশির পুর।<br>
                চেনা মুখেরা হারায় কুয়াশায়,<br>
                তবু মন বলে— কেউ যেন আছে আশেপাশায়।<br>
                <br>
                একলা এই পথ, একলা হৃদয়,<br>
                তবু নির্জনতা নয়, সে যেন স্নেহময়।<br>
                নির্জনতার মাঝে জেগে থাকে আলো,<br>
                যেখানে মিশে যায় জীবন আর ভালো।
            </p>
        </div>
    </main>
