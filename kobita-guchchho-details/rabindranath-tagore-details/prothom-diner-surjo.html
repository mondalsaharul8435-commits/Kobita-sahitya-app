    <main class="poem-content">
        <h2 style="text-align: center; margin-bottom: 20px;">৭. প্রথম দিনের সূর্য</h2>
        
        <div style="poem-text">
            <p style="text-align: center; line-height: 1.8;">
                প্রথম দিনের সূর্য প্রশ্ন করেছিল সত্তার নূতন আবির্ভাবে-কে তুমি।<br>
                মেলেনি উত্তর।<br>
                বৎসর বৎসর চ'লে গেল, দিবসের শেষ সূর্য শেষ প্রশ্ন উচ্চারিল পশ্চিম-সাগর-তীরে,<br>
                নিস্তব্ধ সন্ধ্যায়-কে তুমি।<br>
                পেল না উত্তর।
            </p>
        </div>
    </main>
